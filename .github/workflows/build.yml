name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenTranslator.apk \
            --target "${{ github.sha }}" \
            --title "מתרגם מסך – גרסה אחרונה" \
            --notes "הורד את ScreenTranslator.apk והתקן בטלפון."
