name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore prepared translation model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/translator
            app/src/main/assets/tessdata
            build-model
          key: models-${{ hashFiles('tools/prepare_model.py') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Prepare translation models and OCR data
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install "transformers==4.46.3" "optimum==1.23.3" "onnx==1.17.0" "onnxruntime==1.20.1" \
                      "sentencepiece==0.2.0" "huggingface_hub<0.27" "numpy<2.1"
          python tools/prepare_model.py app/src/main/assets build-model-work build-model
          rm -rf build-model-work
          du -sh app/src/main/assets/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the translator against the reference
        run: |
          chmod +x gradlew
          ./gradlew :translator:test --stacktrace \
            -PmodelDir="$PWD/app/src/main/assets/translator" \
            -PreferenceDir="$PWD/build-model"

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk
          ls -lh ScreenTranslator.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScreenTranslator.apk \
            --target "${{ github.sha }}" \
            --title "מתרגם מסך – גרסה אחרונה" \
            --notes "הורד את ScreenTranslator.apk והתקן בטלפון. תרגום מאנגלית, סינית וערבית לעברית, בלי אינטרנט."
